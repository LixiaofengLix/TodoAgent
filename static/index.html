let editing = null, fPrio = 0, fTags = [], formAtt;

/* ---------- 定时执行选择器：sched 为 null 表示立即执行 ---------- */

let sched = null, schedOpen = false, calY = 0, calM = 0;
const WD = "日一二三四五六";
const SCHED_TIMES = ["09:00", "12:00", "14:00", "18:00", "21:00"];
const dayStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const schedTs = s => { const [h, m] = s.time.split(":").map(Number); return new Date(s.y, s.m, s.d, h, m).getTime() / 1000; };
function schedFromTs(ts, repeat = "") {
  const d = new Date(ts * 1000);
  return { y: d.getFullYear(), m: d.getMonth(), d: d.getDate(), time: d.toTimeString().slice(0, 5), repeat };
}
function dayLabel(d) {
  const diff = Math.round((dayStart(d) - dayStart(new Date())) / 864e5);
  if (diff === 0) return "今天";
  if (diff === 1) return "明天";
  if (diff === 2) return "后天";
  const md = `${d.getMonth() + 1}月${d.getDate()}日`;
  return d.getFullYear() === new Date().getFullYear() ? md : `${d.getFullYear()}年${md}`;
}
function fromNow(sec) {
  if (sec < 3600) return `${Math.max(1, Math.round(sec / 60))} 分钟后`;
  const mins = Math.round(sec / 60);
  if (mins < 1440) { const h = Math.floor(mins / 60), m = mins % 60; return `${h} 小时${m ? ` ${m} 分钟` : ""}后`; }
  const hours = Math.round(sec / 3600), d = Math.floor(hours / 24), h = hours % 24;
  return d < 3 && h ? `${d} 天 ${h} 小时后` : `${Math.round(sec / 86400)} 天后`;
}
function schedSummary(s) {
  const d = new Date(schedTs(s) * 1000);
  if (s.repeat === "daily") return `每天 ${s.time}`;
  if (s.repeat === "weekly") return `每周${WD[d.getDay()]} ${s.time}`;
  return `${dayLabel(d)} ${s.time}`;
}
function schedPresets() {
  const now = new Date();
  const at = (days, h) => { const d = dayStart(now); d.setDate(d.getDate() + days); d.setHours(h); return d; };
  const list = [["1 小时后", new Date(Math.ceil((Date.now() + 3600e3) / 300e3) * 300e3)]];
  if (now.getHours() < 19) list.push(["今晚", at(0, 20)]);
  list.push(["明早", at(1, 9)]);
  list.push(["下周一", at((8 - now.getDay()) % 7 || 7, 9)]);
  return list.filter(([, d], i) => list.findIndex(([, x]) => +x === +d) === i).map(([label, d]) => ({ label, ts: d.getTime() / 1000,
    hint: label === "下周一" ? `${d.getMonth() + 1}/${d.getDate()}` : d.toTimeString().slice(0, 5) }));
}
function setSched(ts) {
  sched = schedFromTs(ts, sched?.repeat || "");
  calY = sched.y; calM = sched.m;
}

function renderSched() {
  const btn = $("f-sched-btn");
  btn.setAttribute("aria-expanded", schedOpen);
  btn.classList.toggle("on", !!sched);
  btn.innerHTML = sched
    ? `${ic(sched.repeat ? "repeat" : "clock", 14)}<span>${esc(schedSummary(sched))}</span>${ic("chevD", 13, "chev-d")}`
    : `${ic("bolt", 14)}<span>立即执行</span><span class="sub">· 设置定时</span>${ic("chevD", 13, "chev-d")}`;
  $("f-sched-clear").hidden = !sched || !!editing;
  $("f-sched").hidden = !(schedOpen && sched);
  $("f-save").textContent = editing ? "保存" : sched ? "定时创建" : "创建任务";
  if (!schedOpen || !sched) return;

  const today = dayStart(new Date()), sel = new Date(sched.y, sched.m, sched.d), ts = schedTs(sched);
  $("cal-title").textContent = `${calY}年${calM + 1}月`;
  $("f-sched").querySelector('[data-cal="-1"]').disabled = calY * 12 + calM <= today.getFullYear() * 12 + today.getMonth();
  const offset = (new Date(calY, calM, 1).getDay() + 6) % 7;
  let cal = [..."一二三四五六日"].map(w => `<span class="wd">${w}</span>`).join("");
  for (let i = 0; i < 42; i++) {
    const d = new Date(calY, calM, 1 - offset + i), t = d.getTime();
    const repeats = sched.repeat && t > sel.getTime() && (sched.repeat === "daily" || d.getDay() === sel.getDay());
    const cls = [d.getMonth() !== calM && "other", t === today.getTime() && "today", t === sel.getTime() && "sel", repeats && "rep"];
    cal += `<button type="button" class="${cls.filter(Boolean).join(" ")}" data-day="${d.getFullYear()}-${d.getMonth()}-${d.getDate()}"
      ${t < today.getTime() ? "disabled" : ""} title="${d.getMonth() + 1}月${d.getDate()}日 周${WD[d.getDay()]}">${d.getDate()}</button>`;
  }
  $("cal-grid").innerHTML = cal;

  $("sched-presets").innerHTML = schedPresets().map(p =>
    `<button type="button" class="chip ${Math.abs(p.ts - ts) < 30 ? "on" : ""}" data-preset="${p.ts}">${p.label}<small>${p.hint}</small></button>`).join("");
  $("sched-times").innerHTML = SCHED_TIMES.map(t => `<button type="button" class="chip ${t === sched.time ? "on" : ""}" data-time="${t}">${t}</button>`).join("");
  if (document.activeElement !== $("sched-time")) $("sched-time").value = sched.time;
  $("sched-repeat").innerHTML = [["", "不重复"], ["daily", "每天"], ["weekly", `每周${WD[sel.getDay()]}`]].map(([k, v]) =>
    `<button type="button" class="${sched.repeat === k ? "on" : ""}" data-repeat="${k}">${v}</button>`).join("");

  const diff = ts - Date.now() / 1000, d = new Date(ts * 1000);
  const full = `${d.getMonth() + 1}月${d.getDate()}日 周${WD[d.getDay()]} ${sched.time}`;
  const pv = $("sched-preview");
  pv.classList.toggle("err", diff <= 0);
  pv.innerHTML = diff <= 0
    ? `${ic("alert", 14)}<span>这个时间已经过去了，请选一个将来的时间</span>`
    : sched.repeat
      ? `${ic("repeat", 14)}<span><b>${esc(schedSummary(sched))}</b> 自动执行，每次到点派生一个新任务<br>首次：${dayLabel(d)}（${full}）· ${fromNow(diff)}</span>`
      : `${ic("clock", 14)}<span><b>${dayLabel(d)} ${sched.time}</b> 到点派生一个新任务执行<br>${full} · ${fromNow(diff)}</span>`;
}

function bindSched() {
  $("f-sched-clear").innerHTML = ic("x", 14);
  $("f-sched").querySelector('[data-cal="-1"]').innerHTML = ic("chevL", 14);
  $("f-sched").querySelector('[data-cal="1"]').innerHTML = ic("chev", 14);
  $("f-sched-btn").addEventListener("click", () => {
    // 默认 1 小时后的整点
    if (!sched) setSched(Math.ceil(Date.now() / 3600e3 + 1) * 3600);
    schedOpen = !schedOpen;
    renderSched();
  });
  $("f-sched-clear").addEventListener("click", () => { sched = null; schedOpen = false; renderSched(); });
  $("f-sched").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    if (b.dataset.cal) {
      const m = calY * 12 + calM + +b.dataset.cal;
      calY = Math.floor(m / 12); calM = m % 12;
    } else if (b.dataset.day) {
      const [y, m, d] = b.dataset.day.split("-").map(Number);
      Object.assign(sched, { y, m, d });
      calY = y; calM = m;
    } else if (b.dataset.preset) setSched(+b.dataset.preset);
    else if (b.dataset.time) sched.time = b.dataset.time;
    else if ("repeat" in b.dataset) sched.repeat = b.dataset.repeat;
    else return;
    renderSched();
  });
  $("sched-time").addEventListener("input", e => { if (e.target.value) { sched.time = e.target.value; renderSched(); } });
  // Esc 先收起定时面板，再关闭弹窗
  formDlg.addEventListener("cancel", e => { if (schedOpen) { e.preventDefault(); schedOpen = false; renderSched(); $("f-sched-btn").focus(); } });
}

/* AI 审核：review 为最近一次结果；undoDesc 为采用前的原描述（非 null 时可撤回）；seq 防止关闭表单后旧结果回填 */
let review = null, undoDesc = null, reviewing = false, reviewSeq = 0;
const VERDICT_CLS = { "可行": "ok", "需补充": "warn", "不可行": "err" };

function resetReview() {
  review = null; undoDesc = null; reviewing = false; reviewSeq++;
  renderReview();
}

async function aiReview() {
  const description = $("f-desc").value.trim();
  if (!description) { $("f-desc").focus(); return toast("先写一点描述再审核", "err"); }
  const seq = ++reviewSeq;
  reviewing = true;
  renderReview();
  try {
    const r = await api("POST", "/review", { title: $("f-title").value.trim(), description, workspace: $("f-workspace").value.trim() });
    if (seq !== reviewSeq) return;
    review = r;
    undoDesc = null;
  } finally {
    if (seq === reviewSeq) { reviewing = false; renderReview(); }
  }
}

function setDesc(text) {
  $("f-desc").value = text;
  autosize($("f-desc"));
  renderFormThumbs();
}
function applyReview() {
  undoDesc = $("f-desc").value;
  setDesc(review.description);
  renderReview();
  toast("已采用完善后的描述，可撤回");
}
function undoReview() {
  setDesc(undoDesc);
  undoDesc = null;
  renderReview();
  toast("已撤回，恢复原描述");
}

function renderReview() {
  const btn = $("f-review-btn"), el = $("f-review");
  btn.disabled = reviewing;
  btn.innerHTML = reviewing ? `<span class="spinner"></span>审核中…` : `${ic("bot", 15)}AI 审核`;
  el.hidden = !review;
  if (!review) return;
  const r = review, cls = VERDICT_CLS[r.verdict] || "";
  const canApply = r.description && r.description !== $("f-desc").value.trim();
  el.innerHTML = `
    <div class="review-head">${r.verdict ? `<span class="verdict ${cls}">${esc(r.verdict)}</span>` : ""}
      <span>${esc(r.summary || "（没有结论）")}</span>
      <button type="button" class="icon-btn sm" onclick="review=null;renderReview()" title="关闭">${ic("x", 13)}</button></div>
    ${r.issues.length ? `<ul>${r.issues.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}
    ${r.description ? `<details><summary>完善后的描述</summary><div class="md">${md(r.description)}</div></details>` : ""}
    ${undoDesc !== null || canApply ? `<div class="review-acts">${undoDesc !== null
      ? `<button type="button" class="btn sm" onclick="undoReview()">${ic("rerun", 13)}撤回，恢复原描述</button>`
      : `<button type="button" class="btn sm primary" onclick="applyReview()">${ic("check", 13)}采用完善后的描述</button>`}</div>` : ""}`;
}

async function save() {
  addFTag();

    title: $("f-title").value.trim(),
    description: formAtt.compose($("f-desc").value.trim()),
    workspace: $("f-workspace").value.trim(),

  };

  if (!data.description) { $("f-desc").focus(); return toast("请填写描述，至少写清目标", "err"); }
  if (sched) {
    data.run_at = schedTs(sched);
    data.repeat = sched.repeat || "once";
    // 编辑时没改时间就不要求晚于现在（比如已执行过的单次任务只改描述）
    const changed = !editing || Math.abs(data.run_at - editing.run_at) >= 60 || data.repeat !== editing.repeat;
    if (changed && !(data.run_at > Date.now() / 1000)) { schedOpen = true; renderSched(); return toast("定时时间需晚于现在", "err"); }
    if (!changed) delete data.run_at;
    if (editing && fActivate) data.active = true;
  }
  const when = !sched ? "" : data.repeat !== "once"
    ? `，${scheduleText({ ...data, run_at: schedTs(sched) })} 自动执行` : `，将于 ${fmtFull(schedTs(sched))} 执行`;
  $("f-save").disabled = true;
  try {
    if (editing) {
      const t = await api("PATCH", `/tasks/${editing.id}`, data);
      toast("已保存" + (isTemplate(t) && !t.active ? "（当前已停用）" : when));
    } else {
      const t = await api("POST", "/tasks", { ...data, source: "web" });
      $("quick").value = "";
      flashId = t.id;
      if (sched) setTab("sched");
      toast(sched ? `已创建定时任务 #${t.id}${when}，到点派生新任务执行` : `已创建 #${t.id}，已加入执行队列`);
    }
  } finally { $("f-save").disabled = false; }
  formDlg.close();
  refresh(true);
  if (view) pollView();
}

/* ---------- 任务详情 / 会话 ---------- */

let view = null;  // { id, task, msgs, openGroups, openSteps, stick }
let msgAtt;

async function openView(id) {
  if (view?.id === id) return;
  view = { id, task: tasks.find(t => t.id === id) || null, msgs: [], openGroups: new Set(), openSteps: new Set(), stick: true, delArm: false };
  history.replaceState(null, "", `#task-${id}`);
  $("msgs").innerHTML = "";
  $("m-input").value = "";
  autosize($("m-input"));
  msgAtt.clear();
  $("d-desc-wrap").open = false;
  if (view.task) renderViewHead();
  $("drawer").classList.add("show");
  $("drawer").inert = false;
  $("scrim").classList.add("show");
  markActiveCard();
  try { await pollView(); }
  catch (e) { closeView(); throw e; }
  if (view?.id === id) {
    $("d-desc-wrap").open = !view.msgs.length;
    setTimeout(() => view?.id === id && $("m-input").focus(), 120);
  }
}

function closeView() {
  if (!view) return;
  view = null;
  $("drawer").classList.remove("show");
  $("drawer").inert = true;
  $("scrim").classList.remove("show");
  history.replaceState(null, "", location.pathname + location.search);
  markActiveCard();
}
function markActiveCard() {
  document.querySelectorAll(".card.active").forEach(c => c.classList.remove("active"));
  if (view) document.querySelector(`.card[data-id="${view.id}"]`)?.classList.add("active");
}

let polling = false;
async function pollView() {
  if (!view || polling) return;
  polling = true;
  try {
    const v = view, lastId = v.msgs.length ? v.msgs.at(-1).id : 0;
    const [task, msgs] = await Promise.all([api("GET", `/tasks/${v.id}`), api("GET", `/tasks/${v.id}/messages?after=${lastId}`)]);
    if (view !== v) return;
    const prev = v.task;
    const fresh = msgs.filter(m => m.id > (v.msgs.at(-1)?.id || 0));
    const threadChanged = fresh.length || !prev || !v.rendered || prev.read_msg_id !== task.read_msg_id || prev.status !== task.status;
    v.task = task;
    v.msgs.push(...fresh);
    if (!prev || !v.rendered || JSON.stringify(prev) !== JSON.stringify(task)) renderViewHead();
    if (threadChanged) { renderThread(); v.rendered = true; }
    renderStatusLine();
  } catch (e) {
    if (/not found/.test(e.message)) { closeView(); toast("任务已不存在", "err"); refresh(true); return; }
    throw e;
  } finally { polling = false; }
}

function renderViewHead() {
  const t = view.task, tpl = isTemplate(t);
  $("d-status").dataset.status = tpl ? (t.active ? "done" : "todo") : t.status;
  $("d-status").innerHTML = `<span class="dot"></span>${tpl ? (t.active ? "已激活" : "已停用") : COLS[t.status]?.label || t.status}`;
  $("composer").style.display = tpl ? "none" : "";
  const parent = t.parent_id && tasks.find(x => x.id === t.parent_id);
  $("d-id").innerHTML = t.parent_id
    ? `<span class="crumb"><a href="#task-${t.parent_id}" title="返回定时任务 #${t.parent_id}">${ic("repeat", 12)}<span>${
        esc(parent ? parent.title : `定时任务 #${t.parent_id}`)}</span></a>${ic("chev", 12)}#${t.id}</span>`
    : `#${t.id}`;
  $("d-title").textContent = t.title;
  $("d-props").innerHTML = `
    <dt>优先级</dt><dd>${prioIcon(t.priority)}${esc(info.priorities[t.priority] ?? t.priority)}</dd>
    <dt>工作目录</dt><dd><span class="mono path" title="${esc(t.workspace)}">${esc(t.workspace || "(默认)")}</span>
      ${t.workspace ? `<button class="icon-btn sm" title="复制路径" onclick="copyText(view.task.workspace)">${ic("copy", 13)}</button>` : ""}</dd>
    ${t.tags.length ? `<dt>标签</dt><dd><div class="tags">${t.tags.map(g => `<span class="tag" style="--h:${tagHue(g)};cursor:default">${esc(g)}</span>`).join("")}</div></dd>` : ""}
    ${tpl ? `<dt>定时</dt><dd>${ic(t.repeat === "once" ? "clock" : "repeat", 13)} ${esc(scheduleText(t))} · ${nextText(t)}</dd>` : ""}
    ${t.parent_id ? `<dt>来自</dt><dd>${parent
      ? `<a href="#task-${t.parent_id}" onclick="openView(${t.parent_id});return false">定时任务 #${t.parent_id} ${esc(parent.title)}</a>`
      : `<span class="muted">定时任务 #${t.parent_id}（已删除）</span>`}</dd>` : ""}
    <dt>来源</dt><dd>${esc(SOURCES[t.source] || t.source)}</dd>
    <dt>时间</dt><dd class="muted">创建于 ${fmtFull(t.created_at)} · 更新于 ${fmtRel(t.updated_at)}</dd>`;
  const hasDesc = !!t.description.trim();
  $("d-desc-wrap").hidden = !hasDesc;
  $("d-desc-sum").innerHTML = `${ic("chev", 14)}任务描述`;
  $("d-desc").innerHTML = md(t.description);
  const busy = t.status === "doing";
  const delBtn = `<button class="btn ghost sm danger ${view.delArm ? "confirm" : ""}" id="d-del" onclick="del()" title="删除任务及其会话">${ic("trash", 14)}${view.delArm ? "确认删除" : ""}</button>`;
  if (tpl) {
    $("d-actions").innerHTML = `
      <button class="btn ghost sm" onclick="openForm(view.task)" title="编辑定时任务">${ic("edit", 14)}编辑</button>
      <button class="btn ghost sm" onclick="runOnce()" title="不影响定时计划，立即派生一个任务执行">${ic("rerun", 14)}立即执行一次</button>
      <button class="btn ghost sm" onclick="toggleActive(view.id)">${ic(t.active ? "x" : "check", 14)}${t.active ? "停用" : "激活"}</button>
      ${delBtn}`;
    return;
  }
  $("d-actions").innerHTML = `
    ${busy ? `<button class="btn ghost sm danger" onclick="stopTask(view.id)" title="立即停止 Agent 及其启动的命令">${ic("stop", 14)}中止</button>` : ""}
    ${busy ? "" : `<button class="btn ghost sm" onclick="openForm(view.task)" title="编辑任务">${ic("edit", 14)}编辑</button>`}
    ${busy ? "" : `<button class="btn ghost sm" onclick="rerun()" title="重新加入执行队列">${ic("rerun", 14)}${t.status === "todo" ? "排队中" : "重新执行"}</button>`}
    ${t.status === "verify" ? `<button class="btn primary sm" onclick="accept(view.id)" title="验收通过，移到右侧完成看板">${ic("check", 14)}已验收</button>` : ""}
    ${busy || t.status === "done" || t.status === "verify" ? "" : `<button class="btn ghost sm" onclick="markDone()" title="手动标记为完成">${ic("check", 14)}完成</button>`}
    ${t.status === "done" ? `<button class="btn ghost sm" onclick="moveTask(view.id, 'done', ${!t.archived})">${ic("archive", 14)}${t.archived ? "取消归档" : "归档"}</button>` : ""}
    ${delBtn}`;
  if (isQueued(t)) $("d-actions").children[1].disabled = true;
  $("m-input").placeholder = t.status === "waiting" ? "回答 Agent 的问题…" : busy ? "补充信息，会在本轮结束后交给 Agent…" : "补充需求、继续讨论…";
}

// 定时任务本身没有会话，主体区域列出它派生的任务（新的在上）
function renderRuns() {
  const runs = runsOf(view.id);
  const done = runs.filter(r => r.status === "done").length, failed = runs.filter(r => r.status === "failed").length;
  $("msgs").innerHTML = `<div class="runs-head"><b>派生任务</b><span class="count">${runs.length}</span>${runs.length
    ? `<span class="runs-stat"><i data-status="done">完成 ${done}</i><i data-status="failed">失败 ${failed}</i></span>` : ""}</div>` +
    (runs.length ? `<div class="run-list">${runs.map(runItem).join("")}</div>`
      : `<div class="thread-empty">还没有派生任务，到点后会出现在这里</div>`);
}

function renderThread() {
  if (isTemplate(view.task)) return renderRuns();
  const sc = $("d-scroll"), atBottom = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 80;
  const items = [];
  for (const m of view.msgs) {
    if (m.role === "progress") {
      const last = items.at(-1);
      if (last?.group) last.steps.push(m); else items.push({ group: true, id: m.id, steps: [m] });
    } else items.push(m);
  }
  const live = view.task.status === "doing";
  $("msgs").innerHTML = items.length
    ? items.map((it, i) => it.group ? groupHtml(it, live && i === items.length - 1) : msgHtml(it)).join("")
    : `<div class="thread-empty">还没有会话记录</div>`;
  if (atBottom || view.stick) { sc.scrollTop = sc.scrollHeight; view.stick = false; }
}

function groupHtml(g, live) {
  const open = view.openGroups.has(g.id), last = g.steps.at(-1);
  const head = live ? `<span class="spinner"></span><b>正在执行 · 第 ${g.steps.length} 步</b>` : `${ic("term", 14)}<b>执行了 ${g.steps.length} 个步骤</b>`;
  return `<div class="steps ${open ? "open" : ""} ${live ? "live" : ""}">
    <button class="steps-head" data-group="${g.id}">${ic("chev", 13, "chev")}${head}
      <span class="steps-last">${open ? "" : esc(firstLine(last.content))}</span><time>${fmtClock(last.created_at)}</time></button>
    ${open ? `<ol class="steps-body">${g.steps.map(stepHtml).join("")}</ol>` : ""}
  </div>`;
}
function stepHtml(s) {
  const full = s.content.trim(), multi = full.includes("\n") || full.length > 140, wrap = view.openSteps.has(s.id);
  return `<li class="step ${multi ? "multi" : ""} ${wrap ? "wrap" : ""}" ${multi ? `data-step="${s.id}" title="点击${wrap ? "收起" : "展开"}"` : ""}>
    <time>${fmtClock(s.created_at, true)}</time><code>${esc(wrap ? full : firstLine(full))}</code></li>`;
}
function msgHtml(m) {
  if (m.role === "system") {
    const c = m.content.trim();
    const kind = c.startsWith("执行失败") ? "err" : c.startsWith("等待") ? "warn" : c.startsWith("执行完成") ? "ok" : "";
    const t = `<time>${fmtClock(m.created_at)}</time>`;
    return c.includes("\n")
      ? `<div class="sys ${kind}"><details><summary>${esc(firstLine(c))} · ${t}</summary><pre>${esc(c)}</pre></details></div>`
      : `<div class="sys ${kind}"><span>${esc(c)} · ${t}</span></div>`;
  }
  const me = m.role === "user", pending = me && m.id > view.task.read_msg_id;
  return `<div class="msg ${me ? "me" : "agent"}">
    ${me ? "" : `<div class="avatar">${ic("bot", 15)}</div>`}
    <div class="bubble-wrap">
      <div class="msg-meta">${me ? "我" : esc(info.agent || "Agent")} · ${fmtClock(m.created_at)}
        ${pending ? `<span class="pending" title="尚未交给 Agent，下次执行时一并发送">未处理</span>` : ""}
        <button class="icon-btn" data-copy="${m.id}" title="复制">${ic("copy", 12)}</button></div>
      <div class="bubble md">${md(me ? m.content : stripMarker(m.content))}</div>
    </div></div>`;
}

const stripMarker = s => info.question_marker ? s.split(info.question_marker).join("").trimEnd() : s;

function renderStatusLine() {
  if (!view?.task) return;
  const t = view.task, el = $("status-line");
  let html = "", cls = "";
  if (t.status === "doing") {
    const start = [...view.msgs].reverse().find(m => m.role === "system" && m.content.startsWith("开始执行"));
    html = `<span class="spinner"></span><b>执行中 · ${start ? fmtElapsed(Date.now() / 1000 - start.created_at) : "-"}</b>` +
      (t.progress ? `<span class="sl-prog">${esc(t.progress)}</span>` : "");
    cls = "doing";
  } else if (isTemplate(t)) {
    html = t.active
      ? `${ic("clock", 14)}<span>定时任务（${esc(scheduleText(t))}），到点派生一个新任务执行 · 下次 ${fmtFull(t.run_at)}</span>`
      : `${ic("clock", 14)}<span>${esc(nextText(t))}</span>`;
  } else if (t.status === "todo") {
    const pos = tasks.filter(isQueued).findIndex(x => x.id === t.id) + 1;
    const blocker = tasks.find(x => x.status === "doing" && x.workspace === t.workspace);
    html = blocker
      ? `${ic("rerun", 14)}<span>排队中，等待同一工作目录的任务 #${blocker.id} 执行完</span>`
      : `${ic("rerun", 14)}<span>排队中${pos ? ` · 第 ${pos} 位` : ""}，等待 Agent 领取</span>`;
  } else if (t.status === "waiting") {
    html = `${ic("msg", 14)}<b>Agent 在等你回复</b><span>回答后点"发送并执行"继续</span>`;
    cls = "warn";
  } else if (t.status === "verify") {
    html = `${ic("check", 14)}<b>Agent 已完成，等你验收</b><span>没问题点"已验收"；不满意可以发消息让它继续改，或点"重新执行"</span>`;
    cls = "verify";
  } else if (t.status === "failed") {
    html = `${ic("alert", 14)}<span>${t.result === "已手动中止" ? "已中止" : "执行失败"}，可以补充信息后发送，或点"重新执行"</span>`;
    cls = "err";
  }
  el.className = `dr-status ${cls}`;
  el.innerHTML = html;
  el.hidden = !html;
}

async function sendMsg(run) {
  const ta = $("m-input");
  if (msgAtt.uploading) return toast("文件还在上传，请稍候", "err");
  const content = msgAtt.compose(ta.value.trim());
  if (!content || !view) return;
  const v = view, wasBusy = v.task?.status === "doing";
  $("send-run").disabled = $("send-only").disabled = true;
  try { await api("POST", `/tasks/${v.id}/messages`, { content, run }); }
  finally { $("send-run").disabled = $("send-only").disabled = false; }
  ta.value = "";
  autosize(ta);
  msgAtt.clear();
  toast(!run ? "已记录，下次执行时一并发送" : wasBusy ? "已发送，本轮结束后自动处理" : "已发送，任务已加入执行队列");
  v.stick = true;
  await pollView();
  refresh(true);
}

async function runOnce(id = view.id) {
  const t = await api("POST", `/tasks/${id}/run-once`);
  toast(`已派生任务 #${t.id}，已加入执行队列`);
  refresh(true);
  if (view) pollView();
}

async function rerun() {
  await api("PATCH", `/tasks/${view.id}`, { status: "todo" });
  toast("已加入执行队列");
  pollView();
  refresh(true);
}
async function markDone() {
  await api("PATCH", `/tasks/${view.id}`, { status: "done" });
  toast("已标记为完成");
  pollView();
  refresh(true);
}
let delTimer;
async function del() {
  if (!view.delArm) {
    view.delArm = true;
    renderViewHead();
    clearTimeout(delTimer);
    delTimer = setTimeout(() => { if (view?.delArm) { view.delArm = false; renderViewHead(); } }, 3000);
    return;
  }
  const id = view.id;
  await api("DELETE", `/tasks/${id}`);
  closeView();
  toast(`已删除 #${id}`);
  refresh(true);
}

async function copyText(text) {
  await navigator.clipboard.writeText(text);
  toast("已复制");
}

function bindDrawer() {
  $("msgs").addEventListener("click", e => {
    const g = e.target.closest("[data-group]");
    if (g) {
      const id = +g.dataset.group;
      view.openGroups.has(id) ? view.openGroups.delete(id) : view.openGroups.add(id);
      return renderThread();
    }
    const s = e.target.closest("[data-step]");
    if (s && !getSelection().toString()) {
      const id = +s.dataset.step;
      view.openSteps.has(id) ? view.openSteps.delete(id) : view.openSteps.add(id);
      return renderThread();
    }
    const c = e.target.closest("[data-copy]");
    if (c) copyText(view.msgs.find(m => m.id === +c.dataset.copy)?.content || "");
  });
  const ta = $("m-input");
  msgAtt = attachments(ta, $("m-att"), $("composer"));
  ta.addEventListener("input", () => autosize(ta));
  ta.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendMsg(true); }
  });
}

/* ---------- 全局 ---------- */

function bindGlobal() {
  document.addEventListener("click", e => {
    const img = e.target.closest("img.zoom");
    if (!img) return;
    e.preventDefault();
    $("lb-img").src = img.src;
    $("lightbox").showModal();
  });
  document.addEventListener("keydown", e => {
    if (e.isComposing || document.querySelector("dialog[open]")) return;
    if (e.key === "Escape") {
      if (typing(e.target) && e.target.value) { e.target.blur(); return; }
      if (typing(e.target) && e.target.id !== "m-input") { e.target.blur(); return; }
      if (view) { e.preventDefault(); closeView(); }
      return;
    }
    if (typing(e.target) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "n" || e.key === "c") { e.preventDefault(); closeView(); $("quick").focus(); }
    else if (e.key === "/") { e.preventDefault(); $("search").focus(); }
  });
  $("quick").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); e.metaKey || e.ctrlKey ? openForm() : quickAdd(); }
  });
  $("search").addEventListener("input", () => { state.q = $("search").value.trim(); render(); });
  $("tag-filter").addEventListener("change", e => { state.tag = e.target.value; render(); });
}

function init() {
  $("logo").innerHTML = ic("logo", 16).replace('stroke-width="2"', 'stroke-width="3"');
  $("quick-wrap").insertAdjacentHTML("afterbegin", ic("plus", 16));
  $("search-wrap").insertAdjacentHTML("afterbegin", ic("search", 15));
  $("d-close").innerHTML = ic("x", 18);
  $("form-close").innerHTML = ic("x", 16);
  $("composer-hint").innerHTML = `${ic("clip", 13)}可粘贴或拖入文件`;
  applyTheme();
  bindBoard();
  let resizeTimer;
  addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });
  bindSchedBoard();
  setTab(state.tab);
  bindForm();
  bindDrawer();
  bindGlobal();
  api("GET", "/info").then(async i => {
    info = i;
    await refresh(true);
    const openFromHash = () => { const m = location.hash.match(/^#task-(\d+)$/); if (m) openView(+m[1]); };
    openFromHash();
    addEventListener("hashchange", openFromHash);
  });
  setInterval(() => !document.hidden && refresh(), 3000);
  setInterval(() => !document.hidden && view && pollView(), 2000);
  setInterval(() => view?.task?.status === "doing" && renderStatusLine(), 1000);
  setInterval(() => !document.hidden && dragId === null && render(), 60000);
}
init();
</script>
</body>
</html>
